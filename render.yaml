services:
  # 1. Python ML Microservice
  - type: web
    name: salesiq-ml-service
    runtime: python
    rootDir: ml-service
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT

  # 2. Node.js Express API Server
  - type: web
    name: salesiq-backend
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ML_SERVICE_URL
        fromService:
          type: web
          name: salesiq-ml-service
          property: url
      - key: MONGO_URI
        sync: false

  # 3. React Vite Frontend (Static Site)
  - type: web
    name: salesiq-frontend
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: salesiq-backend
          property: url
